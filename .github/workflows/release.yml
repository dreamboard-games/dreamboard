name: Offline authoring packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate to npm
        type: boolean
        default: false
      npm_tag:
        description: npm dist-tag
        type: choice
        default: alpha
        options: [alpha, beta, latest]
concurrency:
  group: release-authoring-packages
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/browser-gameplay-runtime exec playwright install --with-deps chromium webkit
      - run: pnpm verify:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-authoring-candidate
          path: build/release-candidate
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: offline-authoring-candidate
          path: build/release-candidate
      - run: node scripts/publish-authoring-release-candidate.ts
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
