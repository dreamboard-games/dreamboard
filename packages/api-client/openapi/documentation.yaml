          type: string
          description: "Opaque revision token for this seat's available descriptors and input domains."
        view:
          type:
            - string
            - "null"
          description: JSON-serialized reducer-projected UI view for this player.
        availableInteractionRefs:
          type: array
          items:
            type: string
          description: Descriptor refs for interactions available to this player.
        zones:
          type: object
          description: "Zone handles for this player, keyed by zone id."
          additionalProperties:
            $ref: "#/components/schemas/ZoneHandles"
    HostPlayerGameplayView:
      type: object
      required:
        - version
        - actionSetVersion
        - perspectivePlayerId
        - controllablePlayerIds
        - shared
        - interactionsByRef
        - seats
      properties:
        version:
          type: integer
          description: Monotonic gameplay version for stale-client detection.
        actionSetVersion:
          type: string
          description: Opaque revision token for the returned descriptors and input domains.
        perspectivePlayerId:
          type: string
          description: Player ID currently selected for rendering and input.
        controllablePlayerIds:
          type: array
          items:
            type: string
          description: Player IDs included in this normalized projection envelope.
        shared:
          $ref: "#/components/schemas/HostGameplaySharedView"
        interactionsByRef:
          type: object
          description: Deduplicated interaction descriptor registry keyed by stable descriptor ref.
          additionalProperties:
            $ref: "#/components/schemas/InteractionDescriptor"
        seats:
          type: object
          description: Player-scoped projections keyed by authorized player id.
          additionalProperties:
            $ref: "#/components/schemas/HostGameplaySeatView"
    HostGameplaySessionSnapshot:
      type: object
      required:
        - type
        - context
        - lobby
        - gameplay
      properties:
        type:
          type: string
          enum:
            - gameplay
        context:
          $ref: "#/components/schemas/HostSessionContext"
        lobby:
          $ref: "#/components/schemas/HostLobbyView"
        gameplay:
          $ref: "#/components/schemas/HostPlayerGameplayView"
    HostEndedSessionSnapshot:
      type: object
      required:
        - type
        - context
        - lobby
      properties:
        type:
          type: string
          enum:
            - ended
        context:
          $ref: "#/components/schemas/HostSessionContext"
        lobby:
          $ref: "#/components/schemas/HostLobbyView"
    HostSessionSnapshot:
      oneOf:
        - $ref: "#/components/schemas/HostLobbySessionSnapshot"
        - $ref: "#/components/schemas/HostGameplaySessionSnapshot"
        - $ref: "#/components/schemas/HostEndedSessionSnapshot"
      discriminator:
        propertyName: type
        mapping:
          lobby: "#/components/schemas/HostLobbySessionSnapshot"
          gameplay: "#/components/schemas/HostGameplaySessionSnapshot"
          ended: "#/components/schemas/HostEndedSessionSnapshot"
    HostSessionSnapshotReason:
      type: string
      enum:
        - load
        - start
        - switch-player
        - resync
    HostSessionSnapshotEvent:
      type: object
      required:
        - type
        - reason
        - snapshot
      properties:
        type:
          type: string
          enum:
            - session.snapshot
        reason:
          $ref: "#/components/schemas/HostSessionSnapshotReason"
        snapshot:
          $ref: "#/components/schemas/HostSessionSnapshot"
    HostSessionLobbyUpdatedEvent:
      type: object
      required:
        - type
        - context
        - lobby
      properties:
        type:
          type: string
          enum:
            - session.lobbyUpdated
        context:
          $ref: "#/components/schemas/HostSessionContext"
        lobby:
          $ref: "#/components/schemas/HostLobbyView"
    HostSessionEventCausation:
      type: object
      properties:
        clientActionId:
          type: string
          nullable: true
    HostSessionGameplayUpdatedEvent:
      type: object
      required:
        - type
        - context
        - gameplay
      properties:
        type:
          type: string
          enum:
            - session.gameplayUpdated
        context:
          $ref: "#/components/schemas/HostSessionContext"
        gameplay:
          $ref: "#/components/schemas/HostPlayerGameplayView"
        causation:
          $ref: "#/components/schemas/HostSessionEventCausation"
          nullable: true
    HostSessionHistoryUpdatedEvent:
      type: object
      required:
        - type
        - context
      properties:
        type:
          type: string
          enum:
            - session.historyUpdated
        context:
          $ref: "#/components/schemas/HostSessionContext"
    HostSessionEndedEvent:
      type: object
      required:
        - type
        - context
        - lobby
      properties:
        type:
          type: string
          enum:
            - session.ended
        context:
          $ref: "#/components/schemas/HostSessionContext"
        lobby:
          $ref: "#/components/schemas/HostLobbyView"
    HostSessionErrorEvent:
      type: object
      required:
        - type
        - sessionId
        - message
        - recoverable
      properties:
        type:
          type: string
          enum:
            - session.error
        sessionId:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
        message:
          type: string
        recoverable:
          type: boolean
    HostSessionEvent:
      oneOf:
        - $ref: "#/components/schemas/HostSessionSnapshotEvent"
        - $ref: "#/components/schemas/HostSessionLobbyUpdatedEvent"
        - $ref: "#/components/schemas/HostSessionGameplayUpdatedEvent"
        - $ref: "#/components/schemas/HostSessionHistoryUpdatedEvent"
        - $ref: "#/components/schemas/HostSessionEndedEvent"
        - $ref: "#/components/schemas/HostSessionErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          session.snapshot: "#/components/schemas/HostSessionSnapshotEvent"
          session.lobbyUpdated: "#/components/schemas/HostSessionLobbyUpdatedEvent"
          session.gameplayUpdated: "#/components/schemas/HostSessionGameplayUpdatedEvent"
          session.historyUpdated: "#/components/schemas/HostSessionHistoryUpdatedEvent"
          session.ended: "#/components/schemas/HostSessionEndedEvent"
          session.error: "#/components/schemas/HostSessionErrorEvent"
    HostSessionEventBatchResponse:
      type: object
      description: Bounded long-poll response for selected-perspective host session updates.
      properties:
        cursor:
          type: integer
          format: int64
          description: Latest persisted session message id covered by this response.
        snapshot:
          $ref: "#/components/schemas/HostSessionSnapshot"
          nullable: true
          description: Fresh baseline snapshot when the caller has no cursor or needs resync.
        events:
          type: array
          items:
            $ref: "#/components/schemas/HostSessionEvent"
          description: Persisted events visible to the requested session actor after the supplied cursor.
        timedOut:
          type: boolean
          description: True when no visible update arrived before the bounded wait elapsed.
      required:
        - cursor
        - events
        - timedOut
    GameplayCapabilityResponse:
      type: object
      required:
        - websocketUrl
        - token
        - expiresAt
        - sessionId
        - playerId
        - permissions
      properties:
        websocketUrl:
          type: string
          format: uri
        token:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        playerId:
          type: string
          minLength: 1
        permissions:
          type: array
          items:
            type: string
            enum:
              - observe
              - submit
              - restore-history
    UpdateSeatRequest:
      type: object
      description: Request to update seat settings (display name and/or player color)
      properties:
        displayName:
          type: string
          description: New display name for the player
          minLength: 1
          maxLength: 30
        playerColor:
          type: string
          description: "Hex color code for the player (e.g., '#FF5733')"
          pattern: "^#[0-9A-Fa-f]{6}$"
    DemoGameSummary:
      type: object
      description: Public demo game summary.
      required:
        - slug
        - name
        - demoPlayerCount
        - registrationStatus
        - playable
      properties:
        slug:
          type: string
          example: hex-network-trading
        name:
          type: string
          example: Hex Network Trading
        description:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
          description: Short public overview shown before starting the demo.
        thumbnailUrl:
          type: string
          nullable: true
          description: Relative URL for the bundled static demo thumbnail.
          example: /api/demo-games/hex-network-trading/thumbnail
        creator:
          type: string
          nullable: true
          description: Public creator or publisher attribution shown in the demo dialog.
        minPlayers:
          type: integer
          nullable: true
          minimum: 1
          description: Minimum supported player count for the demo game.
        maxPlayers:
          type: integer
          nullable: true
          minimum: 1
          description: Maximum supported player count for the demo game.
        playTimeMinMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: Lower bound for the expected play time.
        playTimeMaxMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: Upper bound for the expected play time.
        difficulty:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Lightweight public difficulty rating on a 1-5 scale.
        mechanics:
          type: array
          nullable: true
          description: Public mechanics shown as chips in the demo dialog.
          items:
            type: string
        categories:
          type: array
          nullable: true
          description: Public categories shown as chips in the demo dialog.
          items:
            type: string
        heroImageUrl:
          type: string
          nullable: true
          description: Public hero image URL for the demo dialog.
        estimatedMinutes:
          type: integer
          nullable: true
          minimum: 1
          description: Approximate time needed to try the local demo.
        demoPlayerCount:
          type: integer
          minimum: 1
          description: Number of player seats shown for the local teaching demo.
        registrationStatus:
          type: string
          enum:
            - PENDING
            - REGISTERING
            - REGISTERED
            - FAILED
        playable:
          type: boolean
    DemoGameDetails:
      allOf:
        - $ref: "#/components/schemas/DemoGameSummary"
        - type: object
          properties:
            activeRevisionId:
              type: string
              format: uuid
              nullable: true
              description: Active immutable catalog revision when registered.
            bundleFingerprint:
              type: string
              nullable: true
            error:
              type: string
              nullable: true
    CreateDemoSessionRequest:
      type: object
      description: Optional deterministic seed request for public demo session creation.
      additionalProperties: false
      properties:
        seed:
          type: string
          description: Optional canonical signed decimal Kotlin Long seed. Omit to keep randomized demo behavior.
          pattern: "^(0|-?[1-9][0-9]*)$"
    DemoSessionSeatBinding:
      type: object
      additionalProperties: false
      description: Runtime player id bound to one canonical demo seat.
      required:
        - seat
        - playerId
        - controllable
        - selected
      properties:
        seat:
          type: integer
          minimum: 0
        playerId:
          type: string
          minLength: 1
        controllable:
          type: boolean
        selected:
          type: boolean
    DemoReducerArtifactIdentity:
      type: object
      additionalProperties: false
      description: Canonical identity for the immutable reducer artifact executed by Gameplay Authority.
      required:
        - scheme
        - digest
      properties:
        scheme:
          type: string
          enum:
            - dreamboard-reducer-artifact@1
        digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    DemoSessionResponse:
      type: object
      description: Guest-play session created for a public demo game.
      required:
        - sessionId
        - shortCode
        - demoActorSessionId
        - guestSessionSecret
        - seed
        - playerCount
        - seatBindings
        - reducerArtifactIdentity
        - gameSource
      properties:
        sessionId:
          type: string
          format: uuid
          description: game_sessions.session_id
        shortCode:
          type: string
        demoActorSessionId:
          type: string
          format: uuid
          description: demo_sessions.id; send with demo session secret headers to authorize as DemoGuest.
        guestSessionSecret:
          type: string
          description: Per-session secret; send with demo headers (hashed server-side).
        seed:
          type: string
          description: Canonical signed decimal Kotlin Long seed selected for the demo session.
          pattern: "^(0|-?[1-9][0-9]*)$"
        selectedPlayerId:
          type: string
          nullable: true
        playerCount:
          type: integer
          minimum: 1
          description: Number of demo seats selected from catalog metadata.
        seatBindings:
          type: array
          minItems: 1
          description: Ordered runtime player bindings for each canonical demo seat.
          items:
            $ref: "#/components/schemas/DemoSessionSeatBinding"
        setupProfileId:
          type: string
          description: Setup profile selected by default demo behavior; omitted when the manifest has none.
        reducerArtifactIdentity:
          $ref: "#/components/schemas/DemoReducerArtifactIdentity"
        gameSource:
          $ref: "#/components/schemas/SessionGameSource"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
    ClerkOAuthBootstrap:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Clerk OAuth access token accepted only by POST /api/auth/token-exchange.
