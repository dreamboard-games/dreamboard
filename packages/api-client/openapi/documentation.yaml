    GameRevision:
      type: object
      description: Portable exact authored revision for a project
      properties:
        revisionDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        sourceTreeHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        ruleContentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        manifestContentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        createdAt:
          type: string
          format: date-time
      required:
        - revisionDigest
        - sourceTreeHash
        - ruleContentHash
        - manifestContentHash
        - createdAt
    ProjectRevisionSourcesResponse:
      type: object
