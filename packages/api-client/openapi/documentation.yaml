openapi: 3.1.0
info:
  title: Dreamboard API
  description: API for managing board games and game sessions in Dreamboard
  version: 1.0.0
  contact:
    name: Dreamboard Team
servers:
  - url: https://dreamboard.games
    description: Production server
  - url: http://localhost:8080
    description: Development server
security:
  - BearerAuth: []
tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication and CLI session operations
  - name: Billing
    description: "Billing checkout, subscription management, and entitlements"
  - name: Games
    description: Game management operations
  - name: Projects
    description: Portable project identity operations
  - name: Rulebooks
    description: Rulebook query operations
  - name: Sessions
    description: Game session and lobby management
  - name: UI Bundles
    description: UI bundle fetching and management
  - name: Agent
    description: AI agent operations
  - name: WebSocket
    description: Real-time communication
  - name: Webhooks
    description: Webhook endpoints called by external services
  - name: Development
    description: Development and testing endpoints
  - name: Internal Perf
    description: Internal performance evidence endpoints
  - name: Demo Games
    description: Bundled catalog demos playable without an account
paths:
  /:
    get:
      summary: Health check endpoint
      description: Returns a simple health check message
      operationId: healthCheck
      security: []
      tags:
        - Health
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!
  /api/version:
    get:
      summary: Get backend version metadata
      description: Returns backend revision metadata and the UI SDK version expected by the backend runtime.
      operationId: getApiVersion
      security: []
      tags:
        - Health
      responses:
        "200":
          description: Successfully retrieved backend version metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVersionResponse"
  /api/auth/me:
    get:
      summary: Get the authenticated Dreamboard user identity
      description: "Returns the backend-resolved Dreamboard internal user identity for the\ncurrent bearer token. Provider-specific subjects such as Clerk user IDs\nare exposed only as metadata; clients should use `id` for Dreamboard\nownership and session control.\n"
      operationId: getCurrentAuthUser
      tags:
        - Auth
      responses:
        "200":
          description: Current authenticated user identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/token-exchange:
    post:
      summary: Exchange a Clerk OAuth token for a Dreamboard user token
      description: "Accepts a Clerk OAuth access token only as a bootstrap credential and\nreturns a short-lived Dreamboard JWT for the requested audience. The\nresponse never includes a refresh token.\n"
      operationId: exchangeAuthToken
      tags:
        - Auth
      security:
        - ClerkOAuthBootstrap: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
      x-dreamboard-policy-exemption: credential-bootstrap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Exchanged Dreamboard user token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/jwks:
    get:
      summary: Get Dreamboard user-token public keys
      description: Returns active Dreamboard user-token verification keys.
      operationId: getAuthJwks
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: JSON Web Key Set
  /api/billing/checkout-sessions:
    post:
      summary: Create a Stripe Checkout Session
      description: "Creates a Stripe-hosted subscription checkout session for the current\nauthenticated Dreamboard user. Dreamboard resolves billing ownership\nthrough the internal user id, not through Clerk or Stripe ids.\n"
      operationId: createBillingCheckoutSession
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillingCheckoutSessionRequest"
      responses:
        "200":
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/billing/portal-sessions:
    post:
      summary: Create a Stripe Customer Portal Session
      description: "Creates a Stripe-hosted billing portal session for the current\nauthenticated Dreamboard user.\n"
      operationId: createBillingPortalSession
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillingPortalSessionRequest"
      responses:
        "200":
          description: Billing portal session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/billing/entitlements:
    get:
      summary: Get current user entitlements
      description: Returns backend-owned entitlement state for the current authenticated user.
      operationId: getCurrentBillingEntitlements
      tags:
        - Billing
      responses:
        "200":
          description: Current billing and entitlement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentBillingEntitlementsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/projects:
    get:
      summary: "List user's projects"
      description: "Retrieve all projects installed in the authenticated user's active owner scope."
      operationId: listProjects
      security:
        - BearerAuth: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
        - agent-job
      x-dreamboard-policy:
        action: project.read
        resource:
          type: project
          collection: true
      tags:
        - Projects
      responses:
        "200":
          description: Successfully retrieved project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/game-specs/extract:
    post:
      summary: Extract a structured game spec
      description: Extract a normalized structured game spec from pasted rule text.
      operationId: extractGameSpec
      security:
        - {}
        - BearerAuth: []
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractGameSpecRequest"
      responses:
        "200":
          description: Structured game spec extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractGameSpecResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}":
    get:
      summary: Get project by ID
      description: "Retrieve a project installed in the authenticated user's active owner scope."
      operationId: getProject
      security:
        - BearerAuth: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
        - agent-job
      x-dreamboard-policy:
        action: project.read
        resource:
          type: project
          pathParameter: projectId
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Ensure project
      description: "Ensure a portable project is installed in the authenticated user's active owner scope."
      operationId: ensureProject
      security:
        - BearerAuth: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
        - agent-job
      x-dreamboard-policy:
        action: project.author
        resource:
          type: project
          pathParameter: projectId
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnsureProjectRequest"
      responses:
        "200":
          description: Existing project installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: Newly installed project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update project metadata
      description: "Update project slug, name, description, visibility, or metadata in the active owner scope."
      operationId: updateProject
      security:
        - BearerAuth: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
        - agent-job
      x-dreamboard-policy:
        action: project.author
        resource:
          type: project
          pathParameter: projectId
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete project
      description: Soft delete a project installation in the active owner scope.
      operationId: deleteProject
      security:
        - BearerAuth: []
      x-dreamboard-exposure: public
      x-dreamboard-actors:
        - user
        - agent-job
      x-dreamboard-policy:
        action: project.author
        resource:
          type: project
          pathParameter: projectId
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteProjectResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/repository":
    get:
      summary: Get project repository
      description: "Get the opaque Git repository binding and reconciliation status for a project in the authenticated user's active owner scope."
      operationId: getProjectRepository
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Repository binding found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepository"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Ensure project repository
      description: "Ensure the project installation in the authenticated user's active owner scope has one opaque Git repository binding."
      operationId: ensureProjectRepository
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Repository binding ensured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepository"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/repository/reconcile":
    post:
      summary: Retry project repository reconciliation
      description: "Request a new reconciliation generation for the project's opaque Git repository binding."
      operationId: retryProjectRepositoryReconciliation
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Repository reconciliation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepository"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/builds":
    post:
      summary: Ensure project build
      description: Ensure a server-derived build recipe and compile job exist for one exact observed Git commit.
      operationId: ensureProjectBuild
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnsureProjectBuildRequest"
      responses:
        "200":
          description: Existing or newly queued project build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBuild"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/status/{commitOid}":
    get:
      summary: Get project commit status
      description: "Return server-owned source, build, preview, and release state for one exact Git commit."
      operationId: getProjectCommitStatus
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: commitOid
          in: path
          required: true
          description: Exact Git commit OID already resolved by the caller.
          schema:
            type: string
            pattern: "^[a-f0-9]{40,64}$"
      responses:
        "200":
          description: Server state for the requested commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommitStatus"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/builds/{buildRecipeDigest}":
    get:
      summary: Get project build
      description: Get a server-derived build recipe and compiled artifact state for this project.
      operationId: getProjectBuild
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: buildRecipeDigest
          in: path
          required: true
          description: Canonical build recipe digest.
          schema:
            type: string
            pattern: "^sha256:[a-f0-9]{64}$"
      responses:
        "200":
          description: Project build found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBuild"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/previews":
    post:
      summary: Create project preview
      description: Create a preview aggregate for one exact observed Git commit after its build has succeeded.
      operationId: createProjectPreview
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectPreviewRequest"
      responses:
        "200":
          description: Pending-retention project preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPreview"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/releases":
    post:
      summary: Publish project release
      description: Create a pending release aggregate for one exact observed Git commit after its release build has succeeded.
      operationId: publishProjectRelease
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProjectReleaseRequest"
      responses:
        "200":
          description: Pending-retention project release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRelease"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/releases/current":
    get:
      summary: Get current project release
      description: Read the active release currently selected for a project.
      operationId: getCurrentProjectRelease
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Current active project release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRelease"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/slug/{slug}":
    get:
      summary: Get project by slug
      description: "Resolve a portable project installed in the authenticated user's active owner scope by slug."
      operationId: getProjectBySlug
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/GameSlug"
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/revisions":
    post:
      summary: Create game revision
      description: "Atomically finalize source, rule text, and manifest into one immutable project revision."
      operationId: createGameRevision
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRevisionRequest"
      responses:
        "200":
          description: Existing identical revision returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRevision"
        "201":
          description: Revision created and canonical head advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameRevision"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/revisions/{revisionDigest}/sources":
    get:
      summary: Get project revision source files
      description: Retrieve source files and authored metadata for an immutable project revision digest.
      operationId: getProjectRevisionSources
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RevisionDigest"
      responses:
        "200":
          description: Revision source files retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRevisionSourcesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/source-blobs/upload-sessions":
    post:
      summary: Create project source blob direct-upload targets
      description: Create a direct-upload session for source blobs referenced by a forthcoming project revision.
      operationId: createProjectSourceBlobUploadSession
      security:
        - BearerAuth: []
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceBlobUploadSessionRequest"
      responses:
        "201":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBlobUploadSession"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/revisions/{revisionDigest}/compile":
    post:
      summary: Queue compile for project revision
      description: "Queue an asynchronous compile for one immutable project revision. Poll `/api/jobs/{jobId}` and fetch the final compiled result by ID when the job completes."
      operationId: queueProjectRevisionCompile
      tags:
        - Projects
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RevisionDigest"
      responses:
        "202":
          description: Compile job accepted
          content:
            application/json:
              schema:
