          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Remove a seat from the lobby
      description: "Remove a seat from the lobby (host only, down to minPlayers)"
      operationId: removeSeat
      security:
        - BearerAuth: []
      tags:
        - Sessions
      responses:
        "204":
          description: Seat removed successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/seats/{playerId}/assign":
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    post:
      summary: Assign a seat to current user
      description: Assign the current authenticated user to a specific seat
      operationId: assignSeat
      security:
        - BearerAuth: []
      tags:
        - Sessions
      responses:
        "204":
          description: Seat assigned successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/seats/{playerId}/unassign":
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    post:
      summary: Unassign a seat
      description: Unassign the current user from a specific seat
      operationId: unassignSeat
      security:
        - BearerAuth: []
      tags:
        - Sessions
      responses:
        "204":
          description: Seat unassigned successfully
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/projects/{projectId}/ui-bundle":
    get:
      summary: Fetch project UI bundle
      description: Fetch and return the HTML content for the current compiled UI bundle of a project in the active owner scope.
      operationId: getProjectUiBundle
      security:
        - BearerAuth: []
      tags:
        - UI Bundles
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: UI bundle HTML retrieved successfully
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the UI bundle
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/sessions/{sessionId}/ui-bundle":
    get:
      summary: Fetch session UI bundle
      description: Fetch and return the HTML content for the compiled UI bundle pinned to a gameplay session.
      operationId: getSessionUiBundle
      security:
        - BearerAuth: []
      tags:
        - UI Bundles
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: UI bundle HTML retrieved successfully
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the UI bundle
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/demo-games:
    get:
      summary: List demo games
      description: List bundled demo games that can be opened without a normal user account.
      operationId: listDemoGames
      security: []
      tags:
        - Demo Games
      responses:
        "200":
          description: Successfully retrieved demo games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoGameSummary"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}":
    parameters:
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema:
          type: string
          example: hex-network-trading
    get:
      summary: Get demo game
      description: Return registration and playability metadata for a bundled demo game.
      operationId: getDemoGame
      security: []
      tags:
        - Demo Games
      responses:
        "200":
          description: Successfully retrieved demo game metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoGameDetails"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}/thumbnail":
    parameters:
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema:
          type: string
          example: hex-network-trading
    get:
      summary: Get demo game thumbnail
      description: Return the static thumbnail image for an active bundled demo game.
      operationId: getDemoGameThumbnail
      security: []
      tags:
        - Demo Games
      responses:
        "200":
          description: Successfully retrieved demo thumbnail
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo-games/{slug}/sessions":
    parameters:
      - name: slug
        in: path
        required: true
        description: Demo game slug
        schema:
          type: string
          example: hex-network-trading
    post:
      summary: Create demo session
      description: Create a fresh guest-play session for a bundled demo game.
      operationId: createDemoGameSession
      security: []
      tags:
        - Demo Games
      requestBody:
        description: Optional deterministic demo-session creation inputs.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "201":
          description: Demo session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo/sessions/code/{shortCode}":
    parameters:
      - name: shortCode
        in: path
        required: true
        description: Memorable short code for the demo session.
        schema:
          type: string
    get:
      summary: Get demo session by short code
      description: Look up and hydrate a demo session using its memorable short code.
      operationId: getDemoSessionByShortCode
      security: []
      tags:
        - Demo
      parameters:
        - name: playerId
          in: query
          required: false
          schema:
            type: string
          description: Optional controlled player to include in the selected-perspective gameplay snapshot.
      responses:
        "200":
          description: Demo session found successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSessionSnapshot"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo/sessions/{sessionId}/snapshot":
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get a demo session snapshot
      description: Return the canonical selected-perspective demo session snapshot.
      operationId: getDemoSessionSnapshot
      security: []
      tags:
        - Demo
      parameters:
        - name: playerId
          in: query
          required: false
          schema:
            type: string
          description: Optional controlled player to include in the selected-perspective gameplay snapshot.
      responses:
        "200":
          description: Demo session snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSessionSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo/sessions/{sessionId}/event-batches":
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Long-poll demo lobby session events
      description: "Return a demo lobby snapshot when no cursor is supplied, otherwise return lobby-visible persisted events after the cursor or wait briefly for the next lobby update. Started player gameplay is delivered by Gameplay Authority WebSocket."
      operationId: getDemoSessionLobbyEventBatch
      security: []
      tags:
        - Demo
      parameters:
        - name: afterCursor
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
          description: Latest lobby message cursor received by the client.
        - name: waitMs
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 25000
            default: 25000
          description: Maximum time to hold the request before returning an empty batch.
        - name: clientId
          in: query
          required: true
          schema:
            type: string
          description: Stable browser-tab identifier used to bound concurrent lobby poll requests from the same tab.
        - name: clientSource
          in: query
          required: false
          schema:
            type: string
          description: "Optional caller label for diagnostics, such as `play-page` or `session-play-panel`."
      responses:
        "200":
          description: Demo lobby session event batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSessionEventBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo/sessions/{sessionId}/start":
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Start the demo game
      description: Transition a demo session from lobby to gameplay phase.
      operationId: startDemoGame
      security: []
      tags:
        - Demo
      responses:
        "200":
          description: Demo game started successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSessionSnapshot"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  "/api/demo/sessions/{sessionId}/players/{playerId}/gameplay-capability":
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/PlayerId"
    post:
      summary: Issue a demo gameplay authority capability
      description: Returns a short-lived demo session/player-scoped token and WebSocket URL for connecting to the gameplay authority service.
      operationId: createDemoGameplayCapability
      parameters:
        - name: X-Dreamboard-Browser-Origin
          in: header
          required: false
          description: Canonical browser origin forwarded by the trusted local dev proxy when the normal Origin header is stripped from the server-to-server request.
          schema:
            type: string
      security: []
      tags:
        - Demo
      responses:
        "200":
          description: Demo gameplay capability issued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameplayCapabilityResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/demo/ui-bundles/fetch:
    get:
      summary: Fetch demo UI bundle
      description: Fetch and return the HTML content of a demo session UI bundle from object storage.
      operationId: fetchDemoUiBundle
      security: []
      tags:
        - Demo
      parameters:
        - name: sessionId
          in: query
          description: Demo session whose catalog revision provides the UI bundle.
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Demo UI bundle HTML retrieved successfully
          content:
            text/html:
              schema:
                type: string
                description: HTML content of the UI bundle
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Portable project lineage identifier
      schema:
        type: string
        format: uuid
        example: 0197c768-a8b5-7b42-a3b4-51d68c54f921
    GameSlug:
      name: slug
      in: path
      required: true
      description: URL-safe game slug
      schema:
        type: string
        example: my-game
    RevisionDigest:
      name: revisionDigest
      in: path
      required: true
      description: Portable authored revision digest
      schema:
        type: string
        pattern: "^sha256:[a-f0-9]{64}$"
        example: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Unique identifier for the game session
      schema:
        type: string
        format: uuid
        example: 987e6543-e21b-34d5-b678-542316174000
    PlayerId:
      name: playerId
      in: path
      required: true
      description: "Unique identifier for the player (e.g., 'player-1')"
      schema:
        type: string
        example: player-1
  responses:
    UnauthorizedError:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    BadRequestError:
      description: Bad request - invalid input parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequestsError:
      description: Too many requests or live connections
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ForbiddenError:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ConflictError:
      description: Conflict - version mismatch or resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ApiVersionResponse:
      type: object
      description: Backend runtime version metadata used by local development hosts.
      required:
        - deploymentId
        - backendRevision
        - uiSdkVersion
      properties:
        deploymentId:
          type: string
          description: Stable logical backend deployment identifier used for local CLI state binding.
        backendRevision:
          type: string
          nullable: true
          description: "Deployed backend application revision or git SHA, when available."
        uiSdkVersion:
          type: string
          nullable: true
          description: UI SDK version expected by the backend runtime.
    CurrentAuthUserResponse:
      type: object
      description: Backend-resolved authenticated Dreamboard user identity.
      properties:
        id:
          type: string
          format: uuid
          description: Dreamboard internal user UUID. Use this for ownership and session control.
        provider:
          type: string
          description: External auth provider that authenticated the user.
        providerSubject:
          type: string
          description: "Provider-specific subject, such as a Clerk user ID."
        ownerScopeId:
          type: string
          format: uuid
          description: Active personal owner scope used for project installation and slug uniqueness.
        email:
          type: string
          nullable: true
          description: Verified email address when provided by the auth provider.
      required:
        - id
        - provider
        - providerSubject
        - ownerScopeId
    ProblemType:
      type: string
      description: Stable machine-readable problem identifier
      enum:
        - urn:dreamboard:problem:action-rejected
        - urn:dreamboard:problem:active-job-conflict
        - urn:dreamboard:problem:authoring-state-base-missing
        - urn:dreamboard:problem:authoring-state-drift
        - urn:dreamboard:problem:forbidden
        - urn:dreamboard:problem:game-slug-conflict
        - urn:dreamboard:problem:internal-error
        - urn:dreamboard:problem:project-deleted
        - urn:dreamboard:problem:project-id-invalid
        - urn:dreamboard:problem:project-not-found
        - urn:dreamboard:problem:project-owner-scope-forbidden
        - urn:dreamboard:problem:project-slug-conflict
        - urn:dreamboard:problem:resource-not-found
        - urn:dreamboard:problem:revision-head-conflict
        - urn:dreamboard:problem:source-revision-base-missing
        - urn:dreamboard:problem:source-revision-drift
        - urn:dreamboard:problem:source-revision-not-found
        - urn:dreamboard:problem:state-conflict
        - urn:dreamboard:problem:too-many-requests
        - urn:dreamboard:problem:unauthorized
        - urn:dreamboard:problem:validation-failed
      x-enum-varnames:
        - ACTION_REJECTED
        - ACTIVE_JOB_CONFLICT
        - AUTHORING_STATE_BASE_MISSING
        - AUTHORING_STATE_DRIFT
        - FORBIDDEN
        - GAME_SLUG_CONFLICT
        - INTERNAL_ERROR
        - PROJECT_DELETED
        - PROJECT_ID_INVALID
        - PROJECT_NOT_FOUND
        - PROJECT_OWNER_SCOPE_FORBIDDEN
        - PROJECT_SLUG_CONFLICT
        - RESOURCE_NOT_FOUND
        - REVISION_HEAD_CONFLICT
        - SOURCE_REVISION_BASE_MISSING
        - SOURCE_REVISION_DRIFT
        - SOURCE_REVISION_NOT_FOUND
        - STATE_CONFLICT
        - TOO_MANY_REQUESTS
        - UNAUTHORIZED
        - VALIDATION_FAILED
    ProblemViolation:
      type: object
      properties:
        field:
          type: string
          description: Optional field or input path associated with the issue
        code:
          type: string
          description: Optional machine-readable issue code
        message:
          type: string
          description: Human-readable issue description
      required:
        - message
    ProblemDetails:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ProblemType"
        title:
          type: string
          description: Short summary of the problem type
        status:
          type: integer
          description: HTTP status code for this problem
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
        instance:
          type: string
          description: Request URI or other occurrence identifier
        requestId:
          type: string
          description: Correlation ID for tracing this request across logs and support tooling
        retryable:
          type: boolean
          description: Whether retrying the same request may succeed without changing input
        context:
          type: object
          additionalProperties:
            type: string
          description: Structured context for programmatic handling and richer UX
        violations:
          type: array
          items:
            $ref: "#/components/schemas/ProblemViolation"
          description: Optional structured issues associated with the problem
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the problem response
      required:
        - type
        - title
        - status
        - detail
    TokenExchangeAudience:
      type: string
      description: Short-lived Dreamboard user-token audience requested by the CLI.
      enum:
        - dreamboard-api
        - dreamboard-git
    TokenExchangeRequest:
      type: object
      properties:
        audience:
          $ref: "#/components/schemas/TokenExchangeAudience"
      required:
        - audience
    TokenExchangeResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived Dreamboard JWT for the requested audience.
        tokenType:
          type: string
          enum:
            - Bearer
        audience:
          $ref: "#/components/schemas/TokenExchangeAudience"
        expiresIn:
          type: integer
          format: int64
          description: Token lifetime in seconds.
      required:
        - accessToken
        - tokenType
        - audience
        - expiresIn
    CreateBillingCheckoutSessionRequest:
      type: object
      properties:
        planKey:
          type: string
          description: Dreamboard plan key to purchase.
          default: designer
        successUrl:
          type: string
          description: Absolute URL Stripe should redirect to after successful checkout.
        cancelUrl:
          type: string
          description: Absolute URL Stripe should redirect to if checkout is cancelled.
    BillingSessionResponse:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: string
          description: Stripe-hosted session id.
        url:
          type: string
          description: URL the client should navigate to.
    CreateBillingPortalSessionRequest:
      type: object
      properties:
        returnUrl:
          type: string
          description: Absolute URL Stripe should return to from the billing portal.
    BillingEntitlement:
      type: object
      required:
        - key
        - active
        - source
      properties:
        key:
          type: string
        active:
          type: boolean
        source:
          type: string
        expiresAt:
          type: string
          format: date-time
    CurrentBillingEntitlementsResponse:
      type: object
      required:
        - checkoutEnabled
        - portalEnabled
        - entitlements
      properties:
        checkoutEnabled:
          type: boolean
        portalEnabled:
          type: boolean
        planKey:
          type: string
        subscriptionStatus:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/BillingEntitlement"
    GameMetadata:
      type: object
      properties:
        minPlayers:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: Minimum player count
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 20
          nullable: true
          description: Maximum player count
        playTimeMinMinutes:
          type: integer
          minimum: 1
          nullable: true
          description: Minimum estimated play time in minutes
        playTimeMaxMinutes:
          type: integer
          minimum: 1
          nullable: true
          description: Maximum estimated play time in minutes
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
          description: Complexity rating from 1 (simple) to 5 (complex)
    ProjectHead:
      type: object
      description: Portable exact authored head for a project. Populated after the atomic revision hard cut.
      properties:
        revisionDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: Portable digest of the current authored revision
      required:
        - revisionDigest
    Project:
      type: object
      description: "Public project identity resolved within the caller's active owner scope. It never exposes the deployment-local game instance identifier."
      properties:
        projectId:
          type: string
          format: uuid
          description: Portable project lineage identifier
        slug:
          type: string
          description: URL-safe project slug within the active owner scope
        name:
          type: string
          description: Display name of the project
        description:
          type: string
          nullable: true
          description: Optional project description
        metadata:
          $ref: "#/components/schemas/GameMetadata"
          nullable: true
        public:
          type: boolean
          description: Whether the project is publicly visible
          default: false
        previewStorageKey:
          type: string
          description: Artifact object key for the latest generated project preview PNG
          nullable: true
        initialProjectionKey:
          type: string
          description: Artifact object key for the reducer-native projection used to render previews
          nullable: true
        verified:
          type: boolean
          description: Whether an agent build has passed Dreamboard workspace verification for this project
          default: false
        verifiedAt:
          type: string
