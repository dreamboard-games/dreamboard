          $ref: "#/components/schemas/CompiledResultStorageType"
          description: Where compiled APP (game logic) artifacts are stored
        appStorageKey:
          type: string
          nullable: true
          description: Key/path for compiled APP artifacts. Null when APP compilation fails.
        uiStorageType:
          $ref: "#/components/schemas/CompiledResultStorageType"
          description: Where compiled UI (frontend) artifacts are stored
        uiStorageKey:
          type: string
          nullable: true
          description: Key/path for compiled UI artifacts. Null when UI compilation fails.
        artifactStorageFingerprint:
          type: string
          nullable: true
          description: Non-secret identity of the artifact storage provider used for this compilation. Changes when switching between local filesystem storage and AWS S3 object storage.
        appFingerprint:
          type: string
          nullable: true
          description: Deterministic fingerprint for the APP target inputs used by this compilation.
        uiFingerprint:
          type: string
          nullable: true
          description: Deterministic fingerprint for the UI target inputs used by this compilation.
        sourceRevisionId:
          type: string
          format: uuid
          description: Source revision used to produce this compilation
        sdkVersion:
          type: string
          description: Version of the UI SDK used for this compilation
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - gameRevisionId
        - success
        - appStorageType
        - uiStorageType
        - sourceRevisionId
        - createdAt
        - lastModifiedAt
