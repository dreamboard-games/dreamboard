      enum:
        - local
        - object_store
    CompiledResult:
      type: object
      description: Unified compiled result containing both APP and UI outputs from a single source
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Compiled result identifier
        userId:
          type: string
          format: uuid
        compilationRequestId:
          type: string
          description: Client- or server-generated request correlation id
          nullable: true
        parentResultId:
          type: string
          format: uuid
          description: Parent compiled result ID in the lineage graph
          nullable: true
        lineageRootId:
          type: string
          format: uuid
          description: Root compiled result ID for this lineage
          nullable: true
        gameRevisionId:
          type: string
          format: uuid
          description: Game revision row used for this compilation
        revisionDigest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
          description: Portable authored revision digest used for cross-environment result correlation
          nullable: true
        success:
          type: boolean
          description: Whether the compilation was successful
          default: true
        diagnostics:
          type: array
          description: Compilation diagnostics (only present when success=false)
          nullable: true
          items:
            $ref: "#/components/schemas/CompilationDiagnostic"
